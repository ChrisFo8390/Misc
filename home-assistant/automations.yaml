# ============================================================
# Append these THREE entries to your existing automations.yaml
# list. Do NOT add an "automation:" key here - automations.yaml
# already IS the list assigned to the automation: key.
#
# If automations.yaml currently only contains "[]" (empty
# list placeholder), DELETE that line first.
#
# NOTE: The Trident / Voron 2 Mini entries reference
# binary_sensor.trident_logind_preparing_for_shutdown and
# binary_sensor.voron0_logind_preparing_for_shutdown, which do
# not exist yet - they will appear automatically once
# systemctl-mqtt is installed on each printer's Pi (see
# systemctl-mqtt-install.sh and docs/02-...md). The automations
# are harmless to load before that - they simply never trigger
# until the sensor exists.
# ============================================================

- alias: Voron2TB Auto-Shutdown Power Off
  description: >-
    Detects an externally triggered host shutdown (Mainsail, display,
    SSH) via systemd/MQTT and switches off the Shelly plug afterwards.
  trigger:
    - platform: state
      entity_id: binary_sensor.voron2tb_logind_preparing_for_shutdown
      to: "on"
  condition:
    - condition: state
      entity_id: switch.voron_2_4_switch_0
      state: "on"
  action:
    - delay:
        seconds: 10
    - action: switch.turn_off
      target:
        entity_id: switch.voron_2_4_switch_0
  mode: single

- alias: Trident Auto-Shutdown Power Off
  description: >-
    Detects an externally triggered host shutdown (Mainsail, display,
    SSH) via systemd/MQTT and switches off the Shelly plug afterwards.
  trigger:
