      entity_id: binary_sensor.trident_logind_preparing_for_shutdown
      to: "on"
  condition:
    - condition: state
      entity_id: switch.shelly_voron_trident_switch_0
      state: "on"
  action:
    - delay:
        seconds: 10
    - action: switch.turn_off
      target:
        entity_id: switch.shelly_voron_trident_switch_0
  mode: single

- alias: Voron 2 Mini Auto-Shutdown Power Off
  description: >-
    Detects an externally triggered host shutdown (Mainsail, display,
    SSH) via systemd/MQTT and switches off the Shelly plug afterwards.
  trigger:
