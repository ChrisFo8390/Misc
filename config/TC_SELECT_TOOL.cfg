# ============================================================
# Optional utility macro for manual testing: picks up a toolhead
# via klipper-toolchanger's native SELECT_TOOL command, bypassing
# AFC's T0-T4 wrapper (and therefore its automatic filament load).
#
# IMPORTANT: the parameter is T=<n>, matching klipper-toolchanger's
# own internally generated T0-T4 macros (see the toolhead's own
# klippy.log for confirmation: "SELECT_TOOL T=0" etc.).
# SELECT_TOOL TOOL=<n> is a DIFFERENT, invalid usage that raises an
# unhandled "Unknown config object" error and shuts Klipper down -
# confirmed the hard way, see docs/01-afc-emu-toolchanger-setup.md.
#
# Use case: testing/servicing a toolhead without loading filament.
# Eject the lane first if you don't want load_to_hub auto-loading
# afterwards (BT_LANE_EJECT LANE=laneN).
# ============================================================

[gcode_macro TC_SELECT_TOOL]
description: Picks up only the physical toolhead (SELECT_TOOL, bypassing AFC's load hook). T=<0-4> is required - omitting it or giving an invalid value raises a console error instead of silently defaulting to tool 0. Example: TC_SELECT_TOOL T=0
gcode:
    {% set tool = params.T|default(-1)|int %}
    {% if tool < 0 %}
        { action_raise_error("TC_SELECT_TOOL: Missing parameter T. Example: TC_SELECT_TOOL T=0") }
    {% elif tool > 4 %}
        { action_raise_error("TC_SELECT_TOOL: Invalid tool number %d - allowed range is 0-4" % tool) }
    {% else %}
        SELECT_TOOL T={tool}
    {% endif %}
